<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Alphabet - ISL Project</title>
<link rel="stylesheet" href="style.css?v=9" />
</head>
<body class="page-shell">

  <nav class="navbar glass-nav">
    <div class="brand"><img src="logo.jpeg" alt="ISL sign" class="brand-logo"><span>ISL sign</span></div>
    <a href="index.html" data-nav="home">Home</a>
    <a href="connect.html" data-nav="conversation">Conversation</a>
    <a href="contact.html" data-nav="contact">Contact Us</a>
    <span class="nav-spacer"></span>
    <span id="navAuthArea"></span>
  </nav>

  <div class="empty-state">
    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M6 12c0-3.5 2-6 6-6s6 2.5 6 6-2 6-6 6"/>
      <circle cx="18" cy="6" r="1.3" fill="currentColor" stroke="none"/>
    </svg>
    <h1>Alphabet signs</h1>
    <p class="tagline">
      English alphabet (A&ndash;Z) to ISL sign animation is coming soon.
      Right now, the working demo supports digits 0&ndash;9 &mdash; try it below.
    </p>
    <a href="connect.html" class="cta-button">Start a conversation</a>
  </div>

  <script>
    fetch("/api/me")
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById("navAuthArea");
        if (data.loggedIn) {
          el.innerHTML = `Hi, ${data.name} | <a href="#" id="logoutLink">Logout</a>`;
          document.getElementById("logoutLink").addEventListener("click", (e) => {
            e.preventDefault();
            fetch("/api/logout", { method: "POST" }).then(() => location.reload());
          });
        } else {
          el.innerHTML = `<a href="login.html">Login</a> | <a href="signup.html">Sign Up</a>`;
        }
      });
  </script>

</body>
</html>
