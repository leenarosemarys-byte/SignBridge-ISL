<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - ISL Project</title>
<link rel="stylesheet" href="style.css?v=10" />
</head>
<body class="page-shell">

  <nav class="navbar glass-nav">
    <div class="brand"><img src="logo.jpeg" alt="ISL sign" class="brand-logo"><span>ISL sign</span></div>
    <a href="index.html" data-nav="home">Home</a>
    <a href="connect.html" data-nav="conversation">Conversation</a>
    <a href="contact.html" data-nav="contact">Contact Us</a>
  </nav>

  <main class="auth-shell">
    <div class="auth-card glass-panel">
      <h2>Create account</h2>
      <p class="subtext">Start your premium sign translation experience.</p>
      <form id="signupForm">
        <label>Name</label>
        <input type="text" id="name" required />

        <label>Email</label>
        <input type="email" id="email" required />

        <label>Password (min 6 characters)</label>
        <input type="password" id="password" minlength="6" required />

        <button type="submit">Sign Up</button>
      </form>
      <div id="errorMsg" class="error-msg"></div>
      <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("errorMsg");
      errorEl.textContent = "";

      try {
        const res = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || "Signup failed.";
          return;
        }
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = "Something went wrong. Is the server running?";
      }
    });
  </script>

</body>
</html>
